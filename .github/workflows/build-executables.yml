name: Build Executables

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            os: ubuntu-24.04
            target: linux-x64
            artifact: paperweight-linux-x64
            executable: dist/paperweight-linux-x64
          - label: Raspberry Pi / Linux ARM64
            os: ubuntu-24.04-arm
            target: linux-arm64
            artifact: paperweight-linux-arm64
            executable: dist/paperweight-linux-arm64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install FFmpeg on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Prepare release-check environment
        shell: bash
        run: |
          cat > .env <<'ENV'
          STATION_NAME=Paperweight CI
          STATION_IDENTITY=creator
          CREATOR_NAME=
          CREATOR_DESC=
          PORT=3000
          VAULT_PATH=./vault
          VAULT_MODE=hybrid
          DASHBOARD_TOKEN=ci-dashboard-token-change-me
          DOWNLOAD_SIGNING_SECRET=ci-download-secret-change-me
          HTTPS=false
          STATION_SLUG=
          STATION_PUBLIC_URL=
          CLOUDFLARE_TUNNEL_TOKEN=
          STRIPE_SECRET_KEY=
          STRIPE_WEBHOOK_SECRET=
          STRIPE_PRICE_SUBSCRIBER=
          STRIPE_PRICE_PRO=
          STRIPE_PRICE_ALL_ACCESS=
          PAYPAL_CLIENT_ID=
          PAYPAL_CLIENT_SECRET=
          PAYPAL_PLAN_PRO=
          PAYPAL_PLAN_ALL_ACCESS=
          PAYPAL_WEBHOOK_ID=
          PAPERWEIGHT_CLOUD=false
          DATA_PATH=./data
          HLS_OUTPUT_PATH=./hls_output
          LOG_PATH=./logs
          DOWNLOAD_TOKEN_TTL_HOURS=48
          ENV

      - name: Build executable
        run: npm run build:exe -- --target ${{ matrix.target }}

      - name: Mark executable bit
        run: chmod +x "${{ matrix.executable }}"

      - name: Smoke test executable
        run: npm run smoke:exe -- ${{ matrix.executable }}

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 14

  build-electron:
    name: Electron (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            dist-command: npm run dist:win
            artifact-platform: win32
            artifact-glob: electron/dist/*.exe
          - label: macOS
            os: macos-latest
            dist-command: npm run dist:mac-universal
            artifact-platform: darwin
            artifact-glob: |
              electron/dist/*.dmg
              electron/dist/*.zip
          - label: Linux
            os: ubuntu-24.04
            dist-command: npm run dist:linux
            artifact-platform: linux
            artifact-glob: |
              electron/dist/*.AppImage
              electron/dist/*.deb

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install Electron dependencies
        run: npm ci
        working-directory: electron

      - name: Build Electron installer
        run: ${{ matrix.dist-command }}
        working-directory: electron

      - name: Inspect Electron runtime artifact
        run: npm run check:desktop-artifact -- --platform ${{ matrix.artifact-platform }}

      - name: Clean-install smoke test (Windows)
        if: matrix.artifact-platform == 'win32'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path electron/dist -Filter "Paperweight-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No NSIS installer found in electron/dist" }
          Start-Process -FilePath $installer.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem -Path "$env:LOCALAPPDATA\Programs" -Recurse -Filter "Paperweight.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Could not find installed Paperweight.exe under $env:LOCALAPPDATA\Programs" }
          node scripts/smoke-electron.js $exe.FullName

      - name: Ensure Rosetta 2 (bundled ffprobe runs under it on Apple Silicon)
        if: matrix.artifact-platform == 'darwin'
        shell: bash
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Clean-install smoke test (macOS)
        if: matrix.artifact-platform == 'darwin'
        shell: bash
        run: |
          set -e
          zip_path=$(ls electron/dist/*.zip | head -n1)
          dest=$(mktemp -d)
          ditto -x -k "$zip_path" "$dest"
          app_path=$(find "$dest" -maxdepth 2 -name "Paperweight.app" | head -n1)
          if [ -z "$app_path" ]; then echo "Could not find Paperweight.app inside $zip_path"; exit 1; fi
          chmod +x "$app_path/Contents/MacOS/Paperweight"
          node scripts/smoke-electron.js "$app_path/Contents/MacOS/Paperweight"

      - name: Clean-install smoke test (Linux)
        if: matrix.artifact-platform == 'linux'
        shell: bash
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y xvfb
          appimage=$(ls electron/dist/*.AppImage | head -n1)
          chmod +x "$appimage"
          xvfb-run -a node scripts/smoke-electron.js "$appimage" --appimage-extract-and-run

      - name: Upload Electron installer
        uses: actions/upload-artifact@v4
        with:
          name: paperweight-electron-${{ matrix.label }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 14
